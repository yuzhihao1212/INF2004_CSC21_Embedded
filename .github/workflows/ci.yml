name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  firmware:
    name: Build firmware (Pico SDK 1.5.1)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Same SDK version as the team's Windows installer.
      - uses: actions/checkout@v4
        with:
          repository: raspberrypi/pico-sdk
          ref: 1.5.1
          path: pico-sdk
          submodules: true

      - uses: actions/checkout@v4
        with:
          repository: FreeRTOS/FreeRTOS-Kernel
          ref: 0adc196d4bd52a2d91102b525b0aafc1e14a2386 # V11.2.0
          path: FreeRTOS-Kernel

      # Arm's official GNU toolchain 10.3-2021.10: the same compiler the Pico SDK
      # 1.5.1 Windows installer bundles. Ubuntu's packaged newlib lacks the
      # PRIu64 family of macros that our firmware uses.
      - name: Cache Arm toolchain
        id: toolchain-cache
        uses: actions/cache@v4
        with:
          path: arm-toolchain
          key: arm-gnu-toolchain-10.3-2021.10-x86_64

      - name: Download Arm toolchain
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: |
          mkdir arm-toolchain
          curl -fsSL https://developer.arm.com/-/media/Files/downloads/gnu-rm/10.3-2021.10/gcc-arm-none-eabi-10.3-2021.10-x86_64-linux.tar.bz2 \
            | tar -xj -C arm-toolchain --strip-components=1

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build build-essential
          echo "$GITHUB_WORKSPACE/arm-toolchain/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: cmake -S firmware -B firmware/build -G Ninja -DPICO_SDK_PATH="$GITHUB_WORKSPACE/pico-sdk" -DMOSAIC_BUILD_RTOS=ON -DFREERTOS_KERNEL_PATH="$GITHUB_WORKSPACE/FreeRTOS-Kernel"

      - name: Build
        run: ninja -C firmware/build

      # Flash/RAM per build and every float call in our code; shown on the run's summary page.
      - name: Resource budget
        continue-on-error: true # a report, never a reason to fail the build
        run: |
          python3 firmware/tools/fw_budget.py firmware/build --out firmware/build/resource_budget.md
          cat firmware/build/resource_budget.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-uf2
          path: |
            firmware/build/tests/*.uf2
            firmware/build/node/*.uf2
            firmware/build/resource_budget.md

  python:
    name: Python syntax check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile all scripts
        run: python -m compileall -q ml pc
      - name: Unit tests (incl. C/Python protocol cross-check)
        working-directory: pc
        run: python -m unittest -v
